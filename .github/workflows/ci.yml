name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: imaging
          POSTGRES_PASSWORD: imaging
          POSTGRES_DB: imaging
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U imaging -d imaging"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://imaging:imaging@localhost:5433/imaging
      TEST_DATABASE_URL: postgres://imaging:imaging@localhost:5433/imaging_test
      PORT: 4000
      FIXTURES_DIR: samples
      WEB_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create the test database
        run: PGPASSWORD=imaging createdb -h localhost -p 5433 -U imaging imaging_test

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate

      - name: API tests (real Postgres, with coverage thresholds)
        run: npm run test:api

      - name: React tests (with coverage thresholds)
        run: npm run test:web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (real DICOM viewer)
        run: npm run test:e2e

      - name: Two-process contention smoke test
        run: npm run test:contention

      - name: Production build
        run: npm run build:web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
