services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imaging
      POSTGRES_PASSWORD: imaging
      POSTGRES_DB: imaging
    ports:
      - "5433:5432"
    volumes:
      - imaging_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imaging -d imaging"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  imaging_pgdata:
